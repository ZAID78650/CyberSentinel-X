# CyberSentinel X — Keep-Alive Cron
# Pings the frontend health endpoint every 10 minutes to prevent
# Render free-tier spin-down (services idle >15 min get put to sleep).
# Runs 24/7 via GitHub Actions cron — costs nothing.

name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Frontend
        run: |
          echo "[$(date -u)] Pinging frontend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://cybersentinel-frontend.onrender.com/healthz || echo "000")
          echo "Frontend responded: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Frontend health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Ping Backend
        run: |
          echo "[$(date -u)] Pinging backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://cybersentinel-backend-t5pv.onrender.com/health || echo "000")
          echo "Backend responded: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Backend health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: echo "✅ Keep-alive ping completed at $(date -u)"
