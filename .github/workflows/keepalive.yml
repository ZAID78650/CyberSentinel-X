name: keepalive

# Render free-tier services spin down after ~15 minutes of inactivity and the
# first request after that can 502 while they cold-start. Pinging every 10
# minutes keeps the deployment warm so judges never hit the cold-start window.
#
# Note: GitHub may delay scheduled runs under heavy load; the frontend's
# built-in retry logic covers any residual 502s either way.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Wake the Render deployment
    runs-on: ubuntu-latest
    steps:
      - name: Wake frontend (serves the SPA)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://cybersentinel-frontend.onrender.com/ || echo "000")
          echo "Frontend: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Frontend check failed"
            exit 1
          fi

      - name: Wake backend (via frontend proxy)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            https://cybersentinel-frontend.onrender.com/health || echo "000")
          echo "Backend (via proxy): HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Backend check failed"
            exit 1
          fi

      - name: Wake backend (direct)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://cybersentinel-backend-t5pv.onrender.com/health || echo "000")
          echo "Backend (direct): HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Backend direct check failed"
            exit 1
          fi

      - name: Summary
        if: always()
        run: echo "✅ Keep-alive ping completed at $(date -u)"
