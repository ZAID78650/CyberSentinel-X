<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script>
const W = 1200, H = 630;
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// ── Background ──
ctx.fillStyle = '#0a0e1a';
ctx.fillRect(0, 0, W, H);

// Grid
ctx.strokeStyle = 'rgba(56,189,248,0.04)';
ctx.lineWidth = 1;
for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

// Glow
const grd = ctx.createRadialGradient(900, 100, 10, 900, 100, 500);
grd.addColorStop(0, 'rgba(56,189,248,0.12)');
grd.addColorStop(1, 'transparent');
ctx.fillStyle = grd;
ctx.fillRect(0, 0, W, H);

// Secondary glow
const grd2 = ctx.createRadialGradient(850, 400, 10, 850, 400, 400);
grd2.addColorStop(0, 'rgba(129,140,248,0.06)');
grd2.addColorStop(1, 'transparent');
ctx.fillStyle = grd2;
ctx.fillRect(0, 0, W, H);

// ── LEFT CONTENT ──
const lx = 56, ly = 0;

// Badge
ctx.fillStyle = 'rgba(56,189,248,0.1)';
roundRect(ctx, lx, 52, 220, 28, 14);
ctx.fill();
ctx.strokeStyle = 'rgba(56,189,248,0.35)';
ctx.lineWidth = 1;
roundRect(ctx, lx, 52, 220, 28, 14);
ctx.stroke();
// Badge dot
ctx.fillStyle = '#38bdf8';
ctx.beginPath(); ctx.arc(lx + 14, 66, 3.5, 0, Math.PI * 2); ctx.fill();
// Badge text
ctx.fillStyle = '#38bdf8';
ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
ctx.fillText('SIH 2026 — SIH26184', lx + 24, 70);

// Logo icon
const lgx = lx, lgy = 92;
const lgGrd = ctx.createLinearGradient(lgx, lgy, lgx + 44, lgy + 44);
lgGrd.addColorStop(0, '#38bdf8');
lgGrd.addColorStop(1, '#818cf8');
ctx.fillStyle = lgGrd;
roundRect(ctx, lgx, lgy, 44, 44, 10);
ctx.fill();
// Logo shadow
ctx.shadowColor = 'rgba(56,189,248,0.35)';
ctx.shadowBlur = 20;
ctx.shadowOffsetY = 4;
roundRect(ctx, lgx, lgy, 44, 44, 10);
ctx.fill();
ctx.shadowColor = 'transparent';
ctx.shadowBlur = 0;
ctx.shadowOffsetY = 0;
// Logo text
ctx.fillStyle = '#fff';
ctx.font = '800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
ctx.fillText('CS', lgx + 12, lgy + 30);

// Logo name
const nameGrad = ctx.createLinearGradient(lgx + 54, lgy, lgx + 300, lgy);
nameGrad.addColorStop(0, '#ffffff');
nameGrad.addColorStop(1, '#94a3b8');
ctx.fillStyle = nameGrad;
ctx.font = '800 30px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
ctx.fillText('CyberSentinel X', lgx + 54, lgy + 31);

// Headline
const hy = 158;
ctx.fillStyle = '#fff';
ctx.font = '800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
ctx.fillText('Predict Cybercrime.', lx, hy);

const hlGrad = ctx.createLinearGradient(lx, hy + 42, lx + 220, hy + 42);
hlGrad.addColorStop(0, '#38bdf8');
hlGrad.addColorStop(1, '#818cf8');
ctx.fillStyle = hlGrad;
ctx.fillText('Locate Risk.', lx, hy + 42);

ctx.fillStyle = '#fff';
ctx.fillText('Enable Intervention.', lx, hy + 84);

// Tagline
ctx.fillStyle = '#94a3b8';
ctx.font = '400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
wrapText(ctx, 'AI-powered cybercrime intelligence that transforms complaints and financial signals into predictive, geospatial, and actionable intelligence.', lx, hy + 118, 480, 22);

// Tags
const tags = ['🧠 Predictive Analytics', '🗺️ Risk Heatmap', '⚡ Real-time Alerts', '🔍 Explainable AI'];
let tx = lx, ty = hy + 178;
tags.forEach(tag => {
  const tw = ctx.measureText(tag).width + 22;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  roundRect(ctx, tx, ty, tw, 28, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  roundRect(ctx, tx, ty, tw, 28, 6);
  ctx.stroke();
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(tag, tx + 10, ty + 18);
  tx += tw + 8;
});

// ── RIGHT VISUAL ──
const cx = 920, cy = 280;

// Rings
[[0, 'rgba(56,189,248,0.15)'], [32, 'rgba(129,140,248,0.2)'], [64, 'rgba(56,189,248,0.3)']].forEach(([r, col]) => {
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, 150 - r, 0, Math.PI * 2);
  ctx.stroke();
});

// Connection lines
[[cx - 150, cy - 80, cx - 80, cy - 10], [cx + 150, cy - 80, cx + 80, cy - 10],
 [cx - 150, cy + 80, cx - 80, cy + 10], [cx + 150, cy + 80, cx + 80, cy + 10]].forEach(([x1,y1,x2,y2]) => {
  const lg = ctx.createLinearGradient(x1,y1,x2,y2);
  lg.addColorStop(0, 'transparent');
  lg.addColorStop(0.5, 'rgba(56,189,248,0.25)');
  lg.addColorStop(1, 'transparent');
  ctx.strokeStyle = lg;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
});

// Nodes
const nodes = [
  [cx, cy - 150, 5, '#38bdf8', 10],
  [cx + 150, cy, 5, '#38bdf8', 10],
  [cx, cy + 150, 4, '#818cf8', 8],
  [cx - 150, cy, 4, '#818cf8', 8],
  [cx + 110, cy - 110, 3.5, '#34d399', 8],
  [cx - 110, cy + 110, 3.5, '#f87171', 8],
];
nodes.forEach(([x,y,r,col,glow]) => {
  ctx.shadowColor = col;
  ctx.shadowBlur = glow;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
});

// Shield
const sw = 90, sh = 104;
const sx = cx - sw/2, sy = cy - sh/2;
// Shield shape
ctx.beginPath();
ctx.moveTo(cx, sy);
ctx.bezierCurveTo(cx + sw * 0.55, sy, sx + sw, sy + sh * 0.15, sx + sw, sy + sh * 0.35);
ctx.bezierCurveTo(sx + sw, sy + sh * 0.65, cx + sw * 0.1, cy + sh * 0.45, cx, sy + sh);
ctx.bezierCurveTo(cx - sw * 0.1, cy + sh * 0.45, sx, sy + sh * 0.65, sx, sy + sh * 0.35);
ctx.bezierCurveTo(sx, sy + sh * 0.15, cx - sw * 0.55, sy, cx, sy);
ctx.closePath();

const shGrd = ctx.createLinearGradient(sx, sy, sx, sy + sh);
shGrd.addColorStop(0, 'rgba(56,189,248,0.18)');
shGrd.addColorStop(1, 'rgba(129,140,248,0.08)');
ctx.fillStyle = shGrd;
ctx.fill();
ctx.strokeStyle = 'rgba(56,189,248,0.45)';
ctx.lineWidth = 2;
ctx.stroke();

// Checkmark in shield
ctx.strokeStyle = '#38bdf8';
ctx.lineWidth = 3;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.shadowColor = 'rgba(56,189,248,0.6)';
ctx.shadowBlur = 16;
ctx.beginPath();
ctx.moveTo(cx - 16, cy + 4);
ctx.lineTo(cx - 4, cy + 16);
ctx.lineTo(cx + 18, cy - 10);
ctx.stroke();
ctx.shadowColor = 'transparent';
ctx.shadowBlur = 0;

// ── SIH BADGE ──
ctx.fillStyle = 'rgba(251,191,36,0.1)';
roundRect(ctx, 980, 556, 164, 24, 5);
ctx.fill();
ctx.strokeStyle = 'rgba(251,191,36,0.35)';
ctx.lineWidth = 1;
roundRect(ctx, 980, 556, 164, 24, 5);
ctx.stroke();
ctx.fillStyle = '#fbbf24';
ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
ctx.fillText('🏅 Smart India Hackathon 2026', 990, 572);

// ── BOTTOM BAR ──
ctx.fillStyle = 'rgba(15,23,42,0.88)';
ctx.fillRect(0, H - 42, W, 42);
ctx.strokeStyle = 'rgba(56,189,248,0.15)';
ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(0, H - 42); ctx.lineTo(W, H - 42); ctx.stroke();

const stats = [
  ['#38bdf8', '5', ' ML Models'],
  ['#818cf8', '45', ' Features'],
  ['#34d399', '91%', ' Confidence'],
  ['#fbbf24', '<100ms', ' Latency'],
  ['#f87171', '16', ' API Endpoints'],
];
let sx2 = 200;
stats.forEach(([col, val, label]) => {
  // Dot
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(sx2, H - 21, 3, 0, Math.PI * 2); ctx.fill();
  // Value
  ctx.fillStyle = col;
  ctx.font = '700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(val, sx2 + 8, H - 17);
  // Label
  ctx.fillStyle = '#94a3b8';
  ctx.font = '400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  const vw = ctx.measureText(val).width;
  ctx.fillText(label, sx2 + 8 + vw + 2, H - 17);
  sx2 += ctx.measureText(val + label).width + 50;
});

// ── Helper functions ──
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  words.forEach(w => {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line.trim(), x, y);
      line = w + ' ';
      y += lineH;
    } else {
      line = test;
    }
  });
  ctx.fillText(line.trim(), x, y);
}

// Signal completion
document.title = 'CANVAS_READY';
</script>
</body>
</html>
