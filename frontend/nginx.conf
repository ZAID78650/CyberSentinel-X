server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to an HTTPS upstream (Render/Cloudflare) requires SNI — nginx
    # omits it unless proxy_ssl_server_name is enabled, and Cloudflare's edge
    # rejects SNI-less ClientHellos with TLS alert 40 (handshake failure).
    proxy_ssl_server_name on;

    # API proxy — BACKEND_URL is substituted at container start by the
    # official nginx image's envsubst template mechanism. Locally it is
    # http://backend:8000 (compose service); on Render it is the backend's
    # onrender.com URL.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health endpoints live on the backend root
    location = /health {
        proxy_pass ${BACKEND_URL}/health;
    }
    location = /ready {
        proxy_pass ${BACKEND_URL}/ready;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
