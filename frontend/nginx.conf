# CyberSentinel X — nginx reverse proxy
# Only ${BACKEND_URL} is substituted at container start by envsubst.
# All nginx variables are escaped as $${...} to survive envsubst.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024g;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    proxy_ssl_server_name on;

    # API proxy — strips /api/ prefix before forwarding to backend
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health proxy
    location = /health {
        proxy_pass ${BACKEND_URL}/health;
    }
    location = /ready {
        proxy_pass ${BACKEND_URL}/ready;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
