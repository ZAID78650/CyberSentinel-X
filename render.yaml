services:
  # Backend — FastAPI + gunicorn/uvicorn, Postgres, alembic migrations + seed
  - type: web
    name: cybersentinel-backend
    runtime: docker
    repo: https://github.com/ZAID78650/CyberSentinel-X
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybersentinel-postgres
          property: connectionString
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: LLM_PROVIDER
        value: local
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: VECTOR_DB_BACKEND
        value: local
      - key: VECTOR_DB_PATH
        value: /app/data/vector_store
      - key: DATASET_UPLOAD_DIR
        value: /app/data/uploads
      - key: CORS_ORIGINS
        value: https://cybersentinel-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://cybersentinel-frontend.onrender.com
      - key: BACKEND_URL
        value: https://cybersentinel-backend-t5pv.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: UNSW_DATASET_DIR
        value: ""
      - key: UNSW_INGEST_LIMIT
        value: "0"
    healthCheckPath: /health
    autoDeploy: true

  # Frontend — static build served by nginx, proxying /api + /ws to the backend
  - type: web
    name: cybersentinel-frontend
    runtime: docker
    repo: https://github.com/ZAID78650/CyberSentinel-X
    plan: free
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: PORT
        value: "80"
      - key: BACKEND_URL
        value: https://cybersentinel-backend-t5pv.onrender.com
    healthCheckPath: /healthz
    autoDeploy: true

databases:
  - name: cybersentinel-postgres
    plan: free
    databaseName: cybersentinel
    user: cybersentinel
