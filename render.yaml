# CyberSentinel X — Render Blueprint
# One-click deployment of the full stack (Postgres + FastAPI backend + nginx frontend).
#
# How to deploy:
#   1. Push this repo to GitHub (already done).
#   2. https://render.com → New → Blueprint → connect the GitHub repo
#      (ZAID78650/CyberSentinel-X). Render reads this render.yaml, creates the
#      Postgres database and both web services, and wires the environment.
#   3. First deploy builds both Docker images (backend/ + frontend/), runs
#      alembic migrations + idempotent seed on startup, and comes up healthy.
#
# Free-tier notes:
#   - Persistent disks are NOT available on the free tier, so this blueprint
#     uses no disk. SOC data (events, alerts, incidents, users) lives in the
#     managed Postgres database and survives restarts/redeploys. The bundled
#     UNSW-NB15 sample ships in the image and is restored into the (ephemeral)
#     uploads dir + manifest automatically on startup, so the demo corpus and
#     Dataset Scanner survive redeploys. Uploaded CSV files and the local RAG
#     vector store live on the ephemeral filesystem — upload additional
#     datasets again after a redeploy if they are missing. Paid plans can
#     re-add the disk block.
#   - Free-tier services spin down after ~15 min of inactivity and cold-start
#     on the next request (first load may take ~30-60s). Bump plans in the
#     Render dashboard for always-on.
#   - The public service URLs below are hardcoded because Render's blueprint
#     validator rejects `fromService.property: url`. If Render assigns a
#     different URL (name collision), update these values in the dashboard.
#
# Optional env vars you may want to set per service:
#   - UNSW_DATASET_DIR: absolute path to the UNSW-NB15 CSVs (upload CSVs via
#     the Data Sources → Upload tab instead — no env needed).
#   - SMTP_USER / SMTP_PASSWORD / EMAIL_FROM / OPS_EMAIL for email alerts.
#   - LLM_PROVIDER=openai|gemini + matching API key, if you want the live LLM
#     agent instead of the deterministic local provider.
services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI + gunicorn/uvicorn, Postgres, alembic migrations + seed
  # ---------------------------------------------------------------------------
  - type: web
    name: cybersentinel-backend
    runtime: docker
    repo: https://github.com/ZAID78650/CyberSentinel-X
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybersentinel-postgres
          property: connectionString
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"  # free tier has 512 MB RAM — 1 worker leaves headroom for bulk ingestion
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: LLM_PROVIDER
        value: local
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: VECTOR_DB_BACKEND
        value: local
      - key: VECTOR_DB_PATH
        value: /app/data/vector_store
      - key: DATASET_UPLOAD_DIR
        value: /app/data/uploads
      - key: CORS_ORIGINS
        value: https://cybersentinel-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://cybersentinel-frontend.onrender.com
      - key: BACKEND_URL
        # Public backend origin — the OAuth redirect_uri is built from this.
        # Without it, SSO would redirect the browser to localhost:8000.
        value: https://cybersentinel-backend-t5pv.onrender.com
      # Google / GitHub OAuth (SSO). Create an OAuth app per provider and set
      # the values in the Render dashboard (sync: false = not overwritten by
      # this blueprint). Register these exact redirect URIs with the provider
      # (they must be on the FRONTEND origin — /api is proxied to this backend,
      # so the CSRF state cookie, set on the frontend host, reaches the
      # callback only if the provider redirects the browser back there):
      #   Google:  https://cybersentinel-frontend.onrender.com/api/auth/oauth/google/callback
      #   GitHub:  https://cybersentinel-frontend.onrender.com/api/auth/oauth/github/callback
      # See docs/OAUTH_SETUP.md for the full walkthrough.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: UNSW_DATASET_DIR
        value: ""
      - key: UNSW_INGEST_LIMIT
        value: "0"
    healthCheckPath: /health
  # ---------------------------------------------------------------------------
  # Frontend — static build served by nginx, proxying /api + /ws to the backend
  # ---------------------------------------------------------------------------
  - type: web
    name: cybersentinel-frontend
    runtime: docker
    repo: https://github.com/ZAID78650/CyberSentinel-X
    plan: free
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: PORT
        value: "80"
      - key: BACKEND_URL
        value: https://cybersentinel-backend-t5pv.onrender.com
    healthCheckPath: /healthz
# ---------------------------------------------------------------------------
# Managed PostgreSQL
# ---------------------------------------------------------------------------
databases:
  - name: cybersentinel-postgres
    plan: free
    databaseName: cybersentinel
    user: cybersentinel
