# CyberSentinel X — Render Blueprint
# One-click deployment of the full stack (Postgres + FastAPI backend + nginx frontend).
#
# ─── HOW TO DEPLOY ───────────────────────────────────────────────────────────
#   1. Push this repo to GitHub.
#   2. https://render.com → New → Blueprint → connect the repo (ZAID78650/CyberSentinel-X).
#   3. Render reads this file, creates the Postgres database + both web services.
#   4. First deploy builds Docker images, runs alembic migrations + seed on startup.
#
# ─── CUSTOM DOMAIN ───────────────────────────────────────────────────────────
#   After deployment, add a custom domain in the Render dashboard:
#
#   1. Frontend service → Settings → Custom Domains → Add
#      Enter: www.cybersentinel.io (or your domain)
#      Render gives you a DNS target → update your DNS provider:
#        CNAME  www  →  cybersentinel-frontend.onrender.com
#
#   2. Backend service → Settings → Custom Domains → Add (optional)
#      Only if you want api.cybersentinel.io pointing directly to the backend.
#
#   3. After DNS propagates, update these env vars in the Render dashboard:
#        Backend:  CORS_ORIGINS  → https://www.cybersentinel.io,https://cybersentinel.io
#        Backend:  FRONTEND_URL → https://www.cybersentinel.io
#        Backend:  BACKEND_URL  → https://www.cybersentinel.io (or api.cybersentinel.io)
#        Frontend: BACKEND_URL  → https://cybersentinel-backend-t5pv.onrender.com
#
#   4. Update OAuth redirect URIs in Google/GitHub consoles:
#        Google: https://www.cybersentinel.io/api/auth/oauth/google/callback
#        GitHub: https://www.cybersentinel.io/api/auth/oauth/github/callback
#
#   5. SSL is auto-provisioned by Render (Let's Encrypt). No manual setup needed.
#
# ─── FREE-TIER NOTES ────────────────────────────────────────────────────────
#   - No persistent disk on free tier. SOC data lives in Postgres (survives redeploys).
#   - Bundled UNSW-NB15 sample ships in the image and restores on startup.
#   - Uploaded CSVs + RAG vector store live on ephemeral filesystem (re-upload after redeploy).
#   - Services spin down after ~15 min inactivity. Cold-start takes ~30-60s.
#   - GitHub Actions workflow (.github/workflows/keep-alive.yml) pings every 10 min.
#
# ─── ENVIRONMENT VARIABLES ───────────────────────────────────────────────────
#   Required (set in dashboard, not in this file — sync: false):
#     GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET  — Google OAuth SSO
#     GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET  — GitHub OAuth SSO
#
#   Optional:
#     LLM_PROVIDER=openai|gemini + API key     — Live LLM agent (default: local)
#     SMTP_HOST / SMTP_USER / SMTP_PASSWORD     — Email alerts
#     UNSW_DATASET_DIR                          — Path to UNSW-NB15 CSVs
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── Backend ────────────────────────────────────────────────────────────────
  - type: web
    name: cybersentinel-backend
    runtime: docker
    repo: https://github.com/ZAID78650/CyberSentinel-X
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: cybersentinel-postgres
          property: connectionString

      # Server
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"  # free tier: 512 MB RAM — 1 worker for headroom

      # Authentication
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # ML / LLM
      - key: LLM_PROVIDER
        value: local
      - key: VECTOR_DB_BACKEND
        value: local
      - key: VECTOR_DB_PATH
        value: /app/data/vector_store

      # Data
      - key: DATASET_UPLOAD_DIR
        value: /app/data/uploads
      - key: UNSW_DATASET_DIR
        value: ""
      - key: UNSW_INGEST_LIMIT
        value: "0"

      # CORS — update after custom domain is live
      # Default: allows the Render frontend subdomain
      # After custom domain: add your domain, comma-separated
      - key: CORS_ORIGINS
        value: https://cybersentinel-frontend.onrender.com
        # sync: false  # uncomment to set manually in dashboard
        # Example: https://www.cybersentinel.io,https://cybersentinel.io

      # Frontend URL — used for OAuth redirects and email links
      - key: FRONTEND_URL
        value: https://cybersentinel-frontend.onrender.com
        # After custom domain: https://www.cybersentinel.io

      # Backend public URL — used for OAuth redirect_uri construction
      - key: BACKEND_URL
        value: https://cybersentinel-backend-t5pv.onrender.com
        # After custom domain: https://www.cybersentinel.io (or api.cybersentinel.io)

      # App config
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Google OAuth (set in Render dashboard, not in this file)
      # Redirect URI: https://<FRONTEND_URL>/api/auth/oauth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # GitHub OAuth (set in Render dashboard, not in this file)
      # Redirect URI: https://<FRONTEND_URL>/api/auth/oauth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

    healthCheckPath: /health
    autoDeploy: true

  # ─── Frontend ───────────────────────────────────────────────────────────────
  - type: web
    name: cybersentinel-frontend
    runtime: docker
    repo: https://github.com/ZAID78650/CyberSentinel-X
    plan: free
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: PORT
        value: "80"

      # Backend URL for nginx reverse proxy (internal Docker network)
      # This is the INTERNAL backend service URL, not the public one
      - key: BACKEND_URL
        value: https://cybersentinel-backend-t5pv.onrender.com

    healthCheckPath: /healthz
    autoDeploy: true

# ─── Managed PostgreSQL ──────────────────────────────────────────────────────
databases:
  - name: cybersentinel-postgres
    plan: free
    databaseName: cybersentinel
    user: cybersentinel
